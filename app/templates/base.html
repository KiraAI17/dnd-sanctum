<!DOCTYPE html>
<html lang="ru" class="h-full bg-[#0c0a09] text-stone-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}D&D 5e • Sanctum{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                serif: ['Cinzel', 'Georgia', 'serif'],
                sans: ['Inter', 'system-ui', 'sans-serif'],
              },
              colors: {
                foxCharcoal: '#0c0a09',
                foxStone: '#171412',
                foxCard: '#1f1a17',
                foxOrange: {
                  400: '#fb923c',
                  500: '#f97316',
                  600: '#ea580c',
                  700: '#c2410c',
                },
                foxAmber: {
                  300: '#fde68a',
                  400: '#fcd34d',
                  500: '#f59e0b',
                  600: '#d97706',
                },
                foxEmber: {
                  800: '#9a3412',
                  900: '#7c2d12',
                  950: '#431407',
                }
              }
            }
          }
        }
    </script>

    <style>
        body {
          background-color: #0c0a09;
          background-image:
            radial-gradient(circle at 50% 0%, rgba(234, 88, 12, 0.15) 0%, transparent 55%),
            radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
            linear-gradient(to bottom, #0c0a09 0%, #14100d 100%);
          background-attachment: fixed;
        }

        .fox-embossed {
          background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #ea580c 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 2px 4px rgba(0,0,0,0.85));
        }

        .fox-card {
          background: linear-gradient(160deg, rgba(32, 26, 22, 0.94) 0%, rgba(18, 14, 12, 0.98) 100%);
          border: 1px solid rgba(245, 158, 11, 0.28);
          box-shadow: 0 16px 36px -10px rgba(0,0,0,0.85), inset 0 1px 0 rgba(254, 215, 170, 0.08);
        }
        .fox-card:hover {
          border-color: rgba(249, 115, 22, 0.65);
          box-shadow: 0 20px 42px -10px rgba(0,0,0,0.92), 0 0 20px rgba(234, 88, 12, 0.20);
        }

        .fox-tray {
          background: radial-gradient(circle at center, #2e1208 0%, #1a0a04 75%, #0f0502 100%);
          border: 2px solid rgba(245, 158, 11, 0.40);
          box-shadow: inset 0 8px 24px rgba(0,0,0,0.92), 0 12px 28px rgba(0,0,0,0.8);
        }

        .shield-badge {
          clip-path: polygon(50% 0%, 100% 18%, 100% 65%, 50% 100%, 0% 65%, 0% 18%);
        }

        @keyframes diceShake {
          0% { transform: scale(1) rotate(0deg); }
          20% { transform: scale(1.1) rotate(-10deg); }
          40% { transform: scale(1.12) rotate(10deg); }
          60% { transform: scale(1.05) rotate(-5deg); }
          80% { transform: scale(1.02) rotate(4deg); }
          100% { transform: scale(1) rotate(0deg); }
        }
        .shake {
          animation: diceShake 0.35s ease-in-out;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0c0a09; }
        ::-webkit-scrollbar-thumb { background: #4a2810; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ea580c; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen text-stone-200 antialiased selection:bg-foxOrange-600 selection:text-white">
<header class="sticky top-0 z-40 bg-[#0c0a09]/95 backdrop-blur-md border-b border-orange-950/70 shadow-2xl px-3 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
        <!-- Логотип -->
        <a href="/" class="flex items-center space-x-2 group shrink-0">
            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-amber-500/20 via-foxOrange-600/30 to-black border border-amber-500/40 flex items-center justify-center shadow-lg">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 text-foxOrange-400 filter drop-shadow" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <path d="M4 4l3.5 6L12 7l4.5 3L20 4l-2 13-6 4-6-4L4 4z"/>
                </svg>
            </div>
            <div>
                <span class="text-base sm:text-xl md:text-2xl font-black tracking-wider fox-embossed font-serif">SANCTUM</span>
                <span class="hidden sm:block text-[9px] uppercase tracking-[0.2em] text-amber-400/80 -mt-1 font-serif">Лисий Привал</span>
            </div>
        </a>

        <!-- Меню справа -->
        <div class="flex items-center space-x-1.5 sm:space-x-3">
            <a href="/spells"
               class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg border border-amber-500/40 bg-[#171412] text-amber-200 text-xs font-serif font-bold flex items-center gap-1 shadow">
                <span>✨</span>
                <span class="hidden xs:inline">Гримуар</span>
            </a>

            <a href="/map-editor"
               class="text-xs font-serif text-stone-300 hover:text-amber-300 transition-colors flex items-center gap-1">
                <span>🗺️</span> <span>Редактор карт</span>
            </a>

            <div id="userInfo" class="hidden items-center space-x-1.5 sm:space-x-2">
                <div class="flex items-center gap-1.5 bg-[#171412] border border-orange-900/50 rounded-full py-1 px-2.5 sm:px-3">
                    <div class="w-2 h-2 rounded-full bg-foxOrange-500 animate-pulse"></div>
                    <span id="userUsername"
                          class="font-semibold text-xs text-amber-100 max-w-[80px] sm:max-w-none truncate">...</span>
                </div>
                <button onclick="logout()"
                        class="text-stone-400 hover:text-amber-200 text-xs px-2 py-1 rounded border border-stone-800">
                    Выйти
                </button>
            </div>

            <div id="guestInfo" class="flex items-center">
                <a href="/auth"
                   class="bg-gradient-to-r from-foxOrange-600 to-amber-500 text-stone-950 font-serif font-bold text-xs py-1 px-2.5 sm:px-3 rounded-lg shadow">
                    Войти
                </a>
            </div>
        </div>
    </div>
</header>


<main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
    {% block content %}{% endblock %}
</main>

<footer class="border-t border-orange-950/40 bg-[#080706]/90 py-4 text-center text-xs text-stone-500">
    <span class="font-serif tracking-wider text-amber-500/60">D&D 5E COMPANION SYSTEM</span> • Лисий Привал
</footer>

<script>
    async function apiFetch(url, options = {}) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 3500); // мгновенный таймаут
    options.signal = controller.signal;
    options.headers = options.headers || {};
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(options.body);
    }
      const token = localStorage.getItem('token');
      options.headers = options.headers || {};
      if (token) {
        options.headers['Authorization'] = `Bearer ${token}`;
      }
      if (!(options.body instanceof FormData) && typeof options.body === 'object') {
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
      }
      const response = await fetch(url, options);
      if (response.status === 401) {
        localStorage.removeItem('token');
        if (window.location.pathname !== '/auth') {
          window.location.href = '/auth';
        }
      }
      return response;
    }

    async function checkAuthAndPopulateHeader() {
      const token = localStorage.getItem('token');
      const userBox = document.getElementById('userInfo');
      const guestBox = document.getElementById('guestInfo');

      if (!token) {
        if (userBox) userBox.classList.add('hidden');
        if (guestBox) guestBox.classList.remove('hidden');
        if (window.location.pathname !== '/auth') {
          window.location.href = '/auth';
        }
        return;
      }

      try {
        const res = await apiFetch('/auth/me');
        if (res.ok) {
          const user = await res.json();
          if (guestBox) guestBox.classList.add('hidden');
          if (userBox) {
            userBox.classList.remove('hidden');
            userBox.classList.add('flex');
          }
          const nameEl = document.getElementById('userUsername');
          if (nameEl) nameEl.textContent = user.username;

          const roleBadge = document.getElementById('userRoleBadge');
          if (roleBadge) {
            if (user.role === 'dm' || user.username === 'Ent1XXX') {
              roleBadge.textContent = 'Мастер (DM)';
              roleBadge.className = 'text-[10px] font-serif uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/50';
            } else {
              roleBadge.textContent = 'Игрок';
              roleBadge.className = 'text-[10px] font-serif uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-foxEmber-950 text-orange-200 border border-foxOrange-600/40';
            }
          }
          if (window.location.pathname === '/auth') {
            window.location.href = '/';
          }
        } else {
          localStorage.removeItem('token');
          if (window.location.pathname !== '/auth') window.location.href = '/auth';
        }
      } catch (err) {
        console.error("Ошибка верификации:", err);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/auth';
    }

    document.addEventListener('DOMContentLoaded', checkAuthAndPopulateHeader);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
